name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Stockfish for Android arm64
        run: |
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish
          cd /tmp/Stockfish/src
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -j4 build ARCH=armv8 COMP=ndk
          llvm-strip stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          file stockfish || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ChessBot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: ChessBot APK (latest)
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
